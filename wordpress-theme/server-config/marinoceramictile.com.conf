# Marino Ceramic Tile public reverse-proxy vhost — replaces the domain's static/old vhost.
# TOKENS: marinoceramic marinoceramictile.com {{SUEXEC}} {{SSL_COMBINED}} {{SSL_KEY}}
# Grab {{SUEXEC}} and the SSL cert paths from the domain's CURRENT vhost
# (/etc/apache2/sites-available/marinoceramictile.com.conf) and reuse them here.
# Backend is HTTPS by hostname (Cloudflare passes through). Keep .well-known local for cert renewals.
<VirtualHost *:80>
    SuexecUserGroup {{SUEXEC}}
    ServerName marinoceramictile.com
    ServerAlias www.marinoceramictile.com
    ServerAlias mail.marinoceramictile.com
    ServerAlias webmail.marinoceramictile.com
    ServerAlias admin.marinoceramictile.com
    DocumentRoot /home/marinoceramic/public_html
    ErrorLog /var/log/virtualmin/marinoceramictile.com_error_log
    CustomLog /var/log/virtualmin/marinoceramictile.com_access_log combined

    ProxyPass /.well-known !
    RewriteEngine on
    RewriteCond %{HTTP_HOST} =webmail.marinoceramictile.com
    RewriteRule ^/(?!\.well-known)(.*)$ https://marinoceramictile.com:20000/ [R=301,L]
    RewriteCond %{HTTP_HOST} =admin.marinoceramictile.com
    RewriteRule ^/(?!\.well-known)(.*)$ https://marinoceramictile.com:10000/ [R=301,L]
    RewriteCond %{HTTPS} off
    RewriteCond %{HTTP_HOST} !^(mail|webmail|admin)\.
    RewriteRule ^(.*)$ https://marinoceramictile.com$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    SuexecUserGroup {{SUEXEC}}
    ServerName marinoceramictile.com
    ServerAlias www.marinoceramictile.com
    ServerAlias mail.marinoceramictile.com
    ServerAlias webmail.marinoceramictile.com
    ServerAlias admin.marinoceramictile.com
    DocumentRoot /home/marinoceramic/public_html
    ErrorLog /var/log/virtualmin/marinoceramictile.com_error_log
    CustomLog /var/log/virtualmin/marinoceramictile.com_access_log combined

    <Directory /home/marinoceramic/public_html>
        Options -Indexes +SymLinksIfOwnerMatch
        Require all granted
        AllowOverride All
    </Directory>

    ProxyPass /.well-known !
    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^www\.marinoceramictile.com$ [NC]
    RewriteRule ^ https://marinoceramictile.com%{REQUEST_URI} [R=301,L,NE]
    RewriteCond %{HTTP_HOST} =webmail.marinoceramictile.com
    RewriteRule ^/(?!\.well-known)(.*)$ https://marinoceramictile.com:20000/ [R=301,L]
    RewriteCond %{HTTP_HOST} =admin.marinoceramictile.com
    RewriteRule ^/(?!\.well-known)(.*)$ https://marinoceramictile.com:10000/ [R=301,L]

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    SSLProxyEngine on
    RequestHeader set X-ReviveWP-Public "marinoceramic"
    ProxyPass / https://cms.americancarshipping.com/marinoceramic/ connectiontimeout=5 timeout=60 retry=0
    ProxyPassReverse / https://cms.americancarshipping.com/marinoceramic/

    SSLEngine on
    SSLCertificateFile {{SSL_COMBINED}}
    SSLCertificateKeyFile {{SSL_KEY}}
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
</VirtualHost>
