<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon — ICO for legacy browsers -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- SVG favicon — preferred by modern browsers (Chrome 80+, Firefox 41+, Edge 79+) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Apple Touch Icon (iOS / Safari — 180×180 PNG) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- PWA Manifest (Android chrome icons + theme colour) -->
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Safari pinned tab colour -->
    <meta name="theme-color" content="#9B5434" />
    <meta name="msapplication-TileColor" content="#9B5434" />
    <meta name="msapplication-TileImage" content="/favicon-144x144.png" />
    <meta name="google-site-verification" content="vF0kf1zZOvRoHI3-0ZiMAXtyZGo_Ow9OaiaHrckbj6c" />

    <!--
      All per-page meta (title, description, og:*, twitter:*, canonical,
      JSON-LD schemas) are injected by react-helmet-async in each route.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
