name: Deploy WordPress theme only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marino-wordpress-theme
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install paramiko==5.1.0
      - run: python scripts/deploy_wordpress_theme.py --validate
      - run: python scripts/deploy_wordpress_theme.py
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
