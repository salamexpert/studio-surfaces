name: Automated Blog Generation

on:
  schedule:
    - cron: '0 19 * * *'  # Daily at midnight PKT (UTC+5 = 19:00 UTC)
  workflow_dispatch:        # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install automation dependencies
        working-directory: .github/scripts
        run: npm install

      - name: Run blog automation script
        working-directory: .github/scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: node blog-automation.cjs

      - name: Regenerate sitemap
        working-directory: .github/scripts
        run: node generate-sitemap.cjs

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Stage changes and record whether there is anything new to ship
      - name: Stage and check for changes
        id: changes
        run: |
          git add src/lib/content.ts public/blog-images/ public/sitemap.xml
          if git diff-index --quiet HEAD --; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new content — nothing to commit or deploy."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push new blog files
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git commit -m "🤖 Auto-generate blog post and update sitemap"
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git push --force-with-lease

      # ── Build & deploy (only when new content was generated) ─────────────────

      - name: Install project dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: npm ci

      - name: Build site
        if: steps.changes.outputs.has_changes == 'true'
        run: npm run build

      - name: Deploy files
        if: steps.changes.outputs.has_changes == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/*"
          target: /home/marinoceramictile/public_html/
          strip_components: 1

      - name: Deploy .htaccess
        if: steps.changes.outputs.has_changes == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "dist/.htaccess"
          target: /home/marinoceramictile/public_html/
          strip_components: 1

      - name: Set permissions and reload Apache
        if: steps.changes.outputs.has_changes == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chown -R www-data:www-data /home/marinoceramictile/public_html/
            find /home/marinoceramictile/public_html/ -type f -exec chmod 644 {} \;
            find /home/marinoceramictile/public_html/ -type d -exec chmod 755 {} \;
            systemctl reload apache2
            echo "Deploy complete at $(date)"
